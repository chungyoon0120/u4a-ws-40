<!DOCTYPE html>
<html>

<head>
    <title>U4A Workspace #Main</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

    <!-- ===== from ws10_20.html ===== -->
    <link rel="stylesheet" href="./css/ws10_20.css">
    <link rel="stylesheet" href="../../css/jquery-ui.min.css">
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../ws10_20/design/css/common.css">

    <!-- ===== from Frame.html ===== -->
    <link rel="stylesheet" href="./css/frame.css">

    <!-- ===== 공통 헤더(최상위) 테마 토큰 ===== -->
    <link rel="stylesheet" href="../../css/theme/u4a-theme.css">
    <script>
        // FOUC 방지: data-theme 즉시 적용 (URL u4aTheme → 없으면 purple)
        (function () {
            try {
                var q = new URLSearchParams(location.search).get("u4aTheme");
                var t = (q === "dark" || q === "white" || q === "purple") ? q : "purple";
                document.documentElement.setAttribute("data-theme", t);
            } catch (_) { document.documentElement.setAttribute("data-theme", "purple"); }
        })();
    </script>

    <!-- ===== from Frame.html : scripts ===== -->
    <script src="../../js/jquery.min.js"></script>

    <!-- 공통 리소스 로드 -->
    <script src="../resources/index.js"></script>

    <style>
        .sapMPageFloatingFooter .sapUiHidden {
            transition: top 0.35;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        /* ===== 화면 전체 셸: [공통 헤더] + [컨텐츠(iframe)] 세로 스택 ===== */
        .u4a-app {
            display: flex; flex-direction: column;
            height: 100vh; width: 100vw; overflow: hidden;
        }
        /* 컨텐츠 영역: 로그인/메인 iframe 이 이 박스를 가득 채운다 (헤더 높이 계산 불필요) */
        .u4a-content { position: relative; flex: 1 1 auto; min-height: 0; }
        .u4a-content > iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

        /* ===== 공통 헤더 (최상위 문서이므로 app-region 드래그가 Electron 업그레이드에도 안정적) ===== */
        #u4a-host-titlebar {
            flex: 0 0 34px; height: 34px;
            display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 10px;
            background: var(--u4a-titlebar-bg, #0f0818); color: var(--u4a-titlebar-text, #f4e8ff);
            border-bottom: 1px solid var(--u4a-titlebar-border, rgba(255, 255, 255, .06));
            -webkit-app-region: drag; user-select: none;
            font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif; font-size: 12.5px;
            backdrop-filter: var(--u4a-titlebar-blur, none);
        }
        .u4a-host-titlebar__brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .02em; }
        .u4a-host-brand { width: 18px; height: 18px; object-fit: contain; -webkit-user-drag: none; flex: 0 0 auto; }
        .u4a-host-titlebar__text { font-size: 12.5px; color: var(--u4a-titlebar-text, #f4e8ff); }
        .u4a-host-winbtns { display: flex; gap: 2px; -webkit-app-region: no-drag; }
        .u4a-host-winbtn {
            width: 38px; height: 34px; border: none; background: transparent; color: var(--u4a-winbtn, #e0cef2);
            cursor: pointer; font-size: 12px; border-radius: 6px; transition: background .15s, color .15s;
        }
        .u4a-host-winbtn:hover { background: var(--u4a-winbtn-hover-bg, rgba(255, 255, 255, .08)); color: var(--u4a-winbtn-hover-text, #fff); }
        .u4a-host-winbtn.close:hover { background: var(--u4a-winbtn-close-hover-bg, #d83b3b); color: #fff; }
        .u4a-host-winbtn { display: inline-flex; align-items: center; justify-content: center; padding: 0; }
        .u4a-host-winicon {
            width: 11px; height: 11px; display: block;
            fill: none; stroke: currentColor; stroke-width: 1.1;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .u4a-host-winbtn:active .u4a-host-winicon { transform: scale(.9); }
    </style>
</head>

<body class="sapUiBody u4aWsMainBody">

    <!-- ===== 화면 전체 셸: [공통 헤더] + [컨텐츠(iframe)] ===== -->
    <div id="u4a-app" class="u4a-app">

        <!-- ===== 공통 헤더 (로그인/메인 공용) ===== -->
        <header id="u4a-host-titlebar" class="u4a-host-titlebar">
            <div class="u4a-host-titlebar__brand">
                <img class="u4a-host-brand" src="../../img/logo.png" alt="U4A Workspace" draggable="false"
                     onerror="this.style.visibility='hidden'" />
                <span id="u4a-host-title" class="u4a-host-titlebar__text">U4A Workspace</span>
            </div>
            <div class="u4a-host-winbtns">
                <button id="u4a-host-min" class="u4a-host-winbtn" title="Minimize">
                    <svg class="u4a-host-winicon" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><line x1="1.5" y1="5" x2="8.5" y2="5" /></svg>
                </button>
                <button id="u4a-host-max" class="u4a-host-winbtn" title="Maximize">
                    <svg class="u4a-host-winicon" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><rect x="1.5" y="1.5" width="7" height="7" rx="1.2" /></svg>
                </button>
                <button id="u4a-host-close" class="u4a-host-winbtn close" title="Close">
                    <svg class="u4a-host-winicon" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><line x1="1.6" y1="1.6" x2="8.4" y2="8.4" /><line x1="8.4" y1="1.6" x2="1.6" y2="8.4" /></svg>
                </button>
            </div>
        </header>

        <!-- ===== 컨텐츠 영역: 로그인/메인 iframe 이 여기에 주입된다 ===== -->
        <div id="u4a-content" class="u4a-content">
            <!-- (legacy) UI5 메인 앱 마운트 포인트 — 현재 미사용, 숨김 유지 -->
            <div id="content" style="display: none;" class="u4aWsContent"></div>
        </div>

    </div>

    <!-- ===== from Frame.html : DOM ===== -->
    <!-- <body> -->
    <!-- <iframe id="ws_frame" name="ws_frame" style="border:none;width:100%;height:100%;" allow="autoplay 'src'; fullscreen">  -->
    <!-- <iframe id="ws_frame" name="ws_frame" style="border:none;width:100%;height:100%;" allow="autoplay 'src';">
    </iframe> -->

    <!-- Busy Indicator Start -->
    <div id="u4aWsBusyIndicator" class="u4aWsBusyIndicator sapUiUserSelectable"
        style="position: absolute; display: block; top: 0px; height: 100%; width: 100%; left: 0px;">
        <div class="sapUiBusy" tabindex="0" role="progressbar" alt="" title="Please wait"></div>
        <div class="sapUiLocalBusyIndicator sapUiLocalBusyIndicatorSizeBig sapUiLocalBusyIndicatorFade"
            role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Busy" alt="" tabindex="0"
            title="Please wait">
            <div class="sapUiLocalBusyIndicatorAnimation sapUiLocalBusyIndicatorAnimStandard">
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
    </div>
    <!-- Busy Indicator End -->

    <!-- Network 연결 해제 시 띄울 Loading Bar -->
    <div id="u4a_neterr" class="u4a_neterr u4a_neterrInactive" tabindex="-1">
        <svg class="wifi" viewBox="0 0 40 32">
            <path d="M17.98 28.12c0-1.1.9-2.02 2.02-2.02s2.02.9 2.02 2.02-.9 2.02-2.02 2.02-2.02-.9-2.02-2.02" />
            <path
                d="M20 18.02c3.34 0 6.37 1.36 8.57 3.55l-2.86 2.86c-1.45-1.46-3.47-2.37-5.7-2.37s-4.25.9-5.7 2.37l-2.87-2.86c2.2-2.2 5.23-3.55 8.57-3.55" />
            <path
                d="M5.7 15.86c3.83-3.82 8.9-5.92 14.3-5.92s10.47 2.1 14.3 5.92l-2.87 2.85C28.38 15.67 24.33 14 20 14s-8.38 1.68-11.43 4.73L5.7 15.87" />
            <path
                d="M31 4.08c3.38 1.43 6.4 3.47 9 6.06L37.14 13C32.56 8.42 26.48 5.9 20 5.9S7.44 8.42 2.86 13L0 10.14c2.6-2.6 5.62-4.63 9-6.06 3.48-1.47 7.18-2.22 11-2.22s7.52.74 11 2.22" />
        </svg>
        <div id="u4a_loaders_msg">Network Disconnect....</div>
    </div>

    <!-- Page Loading Start -->
    <div id="u4a_main_load" class="u4a_loaders u4a_loadersInactive" style="display: none;">
        <!-- <span class="u4a_loader u4a_loader-bars"> <span></span> </span> Loading... -->
        <div class="cl_ring">LOADING<span class="cl_ringArea"></span></div>
    </div>
    <!-- Page Loading End -->

    <!-- ai와 if 하기위한 용도의 div -->
    <div id="ai_if_dom" style="display:none;"></div>

    <audio id="u4aWsAudio" style="visibility: hidden;">
    </audio>
    <!-- ===== end Frame.html DOM ===== -->


    <!-- ===== from ws10_20.html : scripts ===== -->

    <!-- <script src="./js/library-preload.js"></script> -->
    <script src="index.js"></script>

</body>

</html>
