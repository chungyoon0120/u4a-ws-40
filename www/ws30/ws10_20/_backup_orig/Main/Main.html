<!DOCTYPE html>
<html lang="ko">

<head>
    <title>U4A Workspace - Main</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

    <link rel="icon" type="image/x-icon" href="../../../img/logo.ico" />
    <link rel="stylesheet" href="css/main.css" />

    <script>
        // FOUC 방지: CSS 로드 전 테마를 즉시 html[data-theme] 에 적용
        //   우선순위: URL 쿼리(u4aTheme) → localStorage → purple
        (function () {
            function valid(v) { return v === "dark" || v === "white" || v === "purple"; }
            var t = "";
            try {
                var q = new URLSearchParams(location.search).get("u4aTheme");
                if (valid(q)) { t = q; try { localStorage.setItem("u4a-ws-theme-v1", q); } catch (_) {} }
            } catch (_) {}
            if (!t) { try { var v = localStorage.getItem("u4a-ws-theme-v1"); if (valid(v)) t = v; } catch (_) {} }
            document.documentElement.setAttribute("data-theme", t || "purple");
        })();
    </script>
</head>

<body>

    <!-- 타이틀바는 공통 헤더(ws10_20/index.html)로 이동 — 이 페이지는 헤더 아래 영역만 채움 -->
    <div class="ws-main-app">

        <!-- ════ 메뉴 바 (customHeader) ════ -->
        <div class="ws-menubar">

            <!-- 좌측 텍스트 메뉴 -->
            <div class="ws-menu-group">
                <button class="ws-menu-btn">추가 정보</button>
                <button class="ws-menu-btn">유틸리티</button>

                <!-- 시스템: 드롭다운 메뉴 (현재 '정보' 항목만) -->
                <div class="ws-menu-wrap">
                    <button id="ws-sys-btn" class="ws-menu-btn" aria-haspopup="true" aria-expanded="false">시스템</button>
                    <div id="ws-sys-menu" class="ws-menu is-hidden" role="menu" aria-label="시스템">
                        <div id="ws-sys-info" class="ws-menu__item" role="menuitem" tabindex="-1">
                            <span class="ws-menu__ico" aria-hidden="true">
                                <span class="ws-ico">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="9" />
                                        <path d="M12 11v5" />
                                        <path d="M12 7.6h.01" />
                                    </svg>
                                </span>
                            </span>
                            <span class="ws-menu__text">정보</span>
                        </div>
                        <div id="ws-sys-options" class="ws-menu__item" role="menuitem" tabindex="-1">
                            <span class="ws-menu__ico" aria-hidden="true">
                                <span class="ws-ico">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="3" />
                                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V15z" />
                                    </svg>
                                </span>
                            </span>
                            <span class="ws-menu__text">옵션</span>
                        </div>
                    </div>
                </div>

                <button class="ws-menu-btn">도움말</button>
                <button class="ws-menu-btn">테스트</button>
            </div>

            <div class="ws-menubar__spacer"></div>

            <!-- 우측 공통 클러스터 -->
            <div class="ws-cluster">

                <!-- AI 연결 상태 -->
                <button class="ws-ai-btn" title="AI 연결/해제">
                    <span class="ws-ico" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M8 7H7a5 5 0 0 0 0 10h1" />
                            <path d="M16 7h1a5 5 0 0 1 0 10h-1" />
                            <path d="M9 12h2" /><path d="M13 12h2" />
                            <path d="M4 4l16 16" opacity=".55" />
                        </svg>
                    </span>
                    <span>AI 연결해제됨</span>
                </button>

                <!-- 숨기기(투명도) -->
                <button class="ws-icon-btn" title="브라우저 숨기기">
                    <span class="ws-ico" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 3l18 18" />
                            <path d="M10.6 5.1A9 9 0 0 1 12 5c6.5 0 10 7 10 7a13.2 13.2 0 0 1-2.2 2.9" />
                            <path d="M6.6 6.6A13 13 0 0 0 2 12s3.5 7 10 7a9 9 0 0 0 3.4-.7" />
                            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                        </svg>
                    </span>
                </button>

                <!-- SAP 로고 (SMEN) -->
                <span class="ws-sap-logo" title="SAP Easy Access (SMEN)">SAP</span>

                <!-- SAP T-CODE -->
                <span class="ws-tcode">
                    <input type="text" placeholder="SAP T-CODE" maxlength="20" autocomplete="off" spellcheck="false" />
                </span>

                <!-- 브라우저 핀 -->
                <button class="ws-icon-btn" title="Browser Pin">
                    <span class="ws-ico" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 17v5" />
                            <path d="M9 3h6l-1.2 5.5L17 12v2H7v-2l3.2-3.5z" />
                        </svg>
                    </span>
                </button>

                <!-- 줌 -->
                <button class="ws-icon-btn" title="zoom">
                    <span class="ws-ico" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7" />
                            <path d="M21 21l-4.3-4.3" />
                            <path d="M11 8v6" /><path d="M8 11h6" />
                        </svg>
                    </span>
                </button>

                <!-- 텍스트 검색 -->
                <button class="ws-icon-btn" title="window Text Search">
                    <span class="ws-ico" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7" />
                            <path d="M21 21l-4.3-4.3" />
                        </svg>
                    </span>
                </button>

                <!-- 로그오프 (red) -->
                <button id="ws-logoff" class="ws-icon-btn ws-icon-btn--danger" title="Logoff">
                    <span class="ws-ico" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3v9" />
                            <path d="M6.5 6.5a8 8 0 1 0 11 0" />
                        </svg>
                    </span>
                </button>

            </div>
        </div>

        <!-- ════ 서브 헤더 툴바 (subHeader) ════ -->
        <div class="ws-toolbar">

            <!-- 생성 -->
            <button class="ws-tool-btn" title="생성 (Ctrl+F12)">
                <span class="ws-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
                        <path d="M14 3v5h5" />
                    </svg>
                </span>
                <span>생성</span>
            </button>

            <!-- 편집 -->
            <button class="ws-tool-btn" title="편집 (F6)">
                <span class="ws-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z" />
                    </svg>
                </span>
                <span>편집</span>
            </button>

            <!-- 삭제 (Reject/red) -->
            <button class="ws-tool-btn ws-tool-btn--danger" title="삭제 (Ctrl+F10)">
                <span class="ws-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18" />
                        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        <path d="M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14" />
                        <path d="M10 11v6" /><path d="M14 11v6" />
                    </svg>
                </span>
                <span>삭제</span>
            </button>

            <!-- 복사 -->
            <button class="ws-tool-btn" title="복사 (Shift+F11)">
                <span class="ws-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="11" height="11" rx="2" />
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                    </svg>
                </span>
                <span>복사</span>
            </button>

            <span class="ws-tool-sep"></span>

            <!-- 조회 -->
            <button class="ws-tool-btn" title="조회 (F7)">
                <span class="ws-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </span>
                <span>조회</span>
            </button>

            <!-- 실행 (Split MenuButton) -->
            <span class="ws-split">
                <button class="ws-tool-btn" title="실행 (F8)">
                    <span class="ws-ico" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9" />
                            <path d="M3 12h18" />
                            <path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z" />
                        </svg>
                    </span>
                    <span>실행</span>
                </button>
                <button class="ws-split__caret" title="브라우저 선택">
                    <span class="ws-ico" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 9l6 6 6-6" />
                        </svg>
                    </span>
                </button>
            </span>

            <span class="ws-tool-sep"></span>

            <!-- 예제 열기 -->
            <button class="ws-tool-btn" title="예제 열기 (Ctrl+F1)">
                <span class="ws-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 7c-2-1.3-5-1.8-8-1v12c3-.8 6-.3 8 1 2-1.3 5-1.8 8-1V6c-3-.8-6-.3-8 1z" />
                        <path d="M12 7v13" />
                    </svg>
                </span>
                <span>예제 열기</span>
            </button>

            <!-- 앱 멀티 미리보기 -->
            <button class="ws-tool-btn" title="앱 멀티 미리보기 (Ctrl+F3)">
                <span class="ws-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="13" height="10" rx="1" />
                        <path d="M6 18h6" /><path d="M9 14v4" />
                        <rect x="16" y="8" width="6" height="12" rx="1" />
                    </svg>
                </span>
                <span>앱 멀티 미리보기</span>
            </button>

            <span class="ws-tool-sep"></span>

            <!-- 새 창 -->
            <button class="ws-tool-btn" title="새 창 (Ctrl+N)">
                <span class="ws-ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <path d="M12 8v8" /><path d="M8 12h8" />
                    </svg>
                </span>
                <span>새 창</span>
            </button>

        </div>

        <!-- ════ 앱 이름 검색 행 ════ -->
        <div class="ws-appname-row">
            <span class="ws-appname-row__label">앱 이름:</span>
            <span class="ws-appname-search">
                <span class="ws-appname-search__ico" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7" />
                        <path d="M21 21l-4.3-4.3" />
                    </svg>
                </span>
                <input type="text" placeholder="Search" autocomplete="off" spellcheck="false" />
            </span>
        </div>

        <!-- ════ 본문 배경 (ws10_20.css 이식, UI5 비의존) ════ -->
        <div class="ws-stage">
            <div class="u4a-ws-root">

                <!-- 배경 이미지 -->
                <div class="u4a-ws-bg-image">
                    <img src="../../../img/UFOA.png" alt="" />
                </div>

                <!-- 글로우 브리딩 -->
                <div class="u4a-ws-anim-glow"></div>

                <!-- 페이드 오버레이 -->
                <div class="u4a-ws-bg-fade"></div>

                <!-- 브랜드 -->
                <div class="u4a-ws-brand-wrap">
                    <div class="u4a-ws-brand-text">
                        <div class="u4a-ws-brand-u4a">U4A</div>
                        <div class="u4a-ws-brand-desc">Workspace</div>
                    </div>
                </div>

                <!-- 인증 뱃지 (다크/퍼플 테마: 흰색 _w) -->
                <div class="u4a-ws-cert-layer u4a-ws-cert-layer--dark">
                    <img src="../../../img/licence/hana/hana_w.png" alt="SAP Certified - Integration with SAP S/4HANA" />
                    <img src="../../../img/licence/hana/hana_cloud_w.png" alt="SAP Certified - Integration with SAP S/4HANA Cloud" />
                    <img src="../../../img/licence/hana/hana_rise_cloud_w.png" alt="SAP Certified - Integration with RISE with SAP S/4HANA Cloud" />
                </div>

                <!-- 인증 뱃지 (화이트 테마: 어두운 _b) -->
                <div class="u4a-ws-cert-layer u4a-ws-cert-layer--light">
                    <img src="../../../img/licence/hana/hana_b.png" alt="SAP Certified - Integration with SAP S/4HANA" />
                    <img src="../../../img/licence/hana/hana_cloud_b.png" alt="SAP Certified - Integration with SAP S/4HANA Cloud" />
                    <img src="../../../img/licence/hana/hana_rise_cloud_b.png" alt="SAP Certified - Integration with RISE with SAP S/4HANA Cloud" />
                </div>

            </div>
        </div>

    </div>

    <!-- 모달(정보 팝업 등) 루트 -->
    <div id="ws-modal-root"></div>

    <script src="Main.js"></script>
</body>

</html>
