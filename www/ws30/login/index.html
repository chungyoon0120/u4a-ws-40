<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U4A Workspace - Login</title>
    <style>
        /* ====================================================================
           U4A Workspace — Login Page (ws30/login)
           - 부모 메인(ws30/main/index.html)이 로그인 미수행 상태일 때 호출하는 페이지
           - 단독 로드도 가능하도록 standalone 으로 구성 (IPC if-meta-info 수신 지원)
           ==================================================================== */

        /* Reset */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            font-size: 14px;
            color: #1F2937;
            background: #F4F5F7;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        button { font-family: inherit; }

        /* ---------- 타이틀바 (BrowserWindow titleBarStyle:'hidden' 대응 커스텀) ----------
           ※ iframe 모드(부모 main/index.html 에 의해 임베드된 경우)에서는 .is-embedded 가 붙어 자동 숨김 */
        .lp-titlebar {
            -webkit-app-region: drag;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 32px;
            background: #FFFFFF;
            border-bottom: 1px solid #E5E7EB;
            user-select: none;
            flex-shrink: 0;
        }
        body.is-embedded .lp-titlebar { display: none; }
        body.is-embedded { background: transparent; }
        .lp-titlebar__brand {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            font-size: 12px;
            color: #374151;
        }
        .lp-winbtns {
            -webkit-app-region: no-drag;
            display: flex;
            align-items: stretch;
        }
        .lp-winbtn {
            width: 46px; height: 32px;
            border: 0; background: transparent;
            color: #6B7280; cursor: pointer;
            font-size: 14px;
            line-height: 1;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .lp-winbtn:hover { background: #F3F4F6; }
        .lp-winbtn.close:hover { background: #E81123; color: #FFFFFF; }
        .lp-winicon {
            width: 11px; height: 11px; display: block;
            fill: none; stroke: currentColor; stroke-width: 1.1;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .lp-winbtn:active .lp-winicon { transform: scale(.9); }
        .lp-winicon--restore { display: none; }
        .lp-winbtn.is-maximized .lp-winicon--max { display: none; }
        .lp-winbtn.is-maximized .lp-winicon--restore { display: block; }

        /* ---------- WS 브랜드 마크 (W with subscript s, 퍼플) ---------- */
        .lp-mark {
            display: inline-flex;
            align-items: baseline;
            color: #B528C7;
            font-weight: 800;
            font-style: italic;
            line-height: 1;
            letter-spacing: -1px;
        }
        .lp-mark__s {
            font-size: 0.55em;
            margin-left: -0.05em;
        }
        .lp-mark--sm { font-size: 16px; }
        .lp-mark--lg { font-size: 30px; }

        /* ---------- 페이지 ---------- */
        .lp-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: auto;
        }

        /* ---------- 카드 ---------- */
        .lp-card {
            background: #FFFFFF;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(17, 24, 39, 0.08), 0 1px 3px rgba(17, 24, 39, 0.06);
            padding: 36px 52px 40px;
            width: 100%;
            max-width: 440px;
        }
        .lp-card__head {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 18px;
            margin-bottom: 22px;
            border-bottom: 1px solid #E5E7EB;
        }
        .lp-card__title {
            margin: 0;
            font-size: 19px;
            font-weight: 700;
            color: #1F2937;
            letter-spacing: -0.2px;
        }

        /* ---------- 폼 필드 ---------- */
        .lp-field { margin-bottom: 16px; }
        .lp-field__label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #6B7280;
            margin-bottom: 6px;
            letter-spacing: 0.4px;
        }
        .lp-field__label--normal {
            text-transform: none;
            letter-spacing: 0;
            font-weight: 600;
        }

        .lp-input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .lp-input {
            width: 100%;
            border: 0;
            border-bottom: 1px solid #D1D5DB;
            padding: 8px 32px 8px 0;
            font-size: 14px;
            color: #111827;
            background: transparent;
            outline: none;
            transition: border-color 0.15s ease;
        }
        .lp-input:focus { border-bottom-color: #2563EB; border-bottom-width: 2px; padding-bottom: 7px; }
        .lp-input::placeholder { color: #9CA3AF; }

        .lp-select {
            width: 100%;
            border: 0;
            border-bottom: 1px solid #D1D5DB;
            padding: 8px 28px 8px 0;
            font-size: 14px;
            color: #111827;
            background-color: transparent;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236B7280'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 4px center;
            background-size: 18px;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }
        .lp-select:focus { border-bottom-color: #2563EB; border-bottom-width: 2px; padding-bottom: 7px; }

        .lp-input-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #2563EB;
            cursor: pointer;
            padding: 4px 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .lp-input-btn:hover { background: rgba(37, 99, 235, 0.08); }
        .lp-input-btn.is-hidden { display: none; }
        .lp-input-btn svg { width: 16px; height: 16px; }

        /* ---------- Remember (체크박스) ---------- */
        .lp-field--check { margin-bottom: 22px; }
        .lp-checkbox {
            width: 18px; height: 18px;
            margin: 0;
            cursor: pointer;
            accent-color: #2563EB;
        }

        /* ---------- LOGIN 버튼 ---------- */
        .lp-btn-login {
            width: 100%;
            border: 0;
            background: #1D6EE2;
            color: #FFFFFF;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            margin-bottom: 14px;
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }
        .lp-btn-login:hover  { background: #1A5FC4; }
        .lp-btn-login:active { background: #164FA3; }
        .lp-btn-login:focus-visible { outline: 2px solid #93C5FD; outline-offset: 2px; }

        /* ---------- Quick login (영선/성호/은섭/청윤) ---------- */
        .lp-quick {
            display: flex;
            gap: 8px;
        }
        .lp-quick__btn {
            flex: 1;
            border: 1px solid #1D6EE2;
            background: transparent;
            color: #1D6EE2;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .lp-quick__btn:hover  { background: #EFF6FF; }
        .lp-quick__btn:active { background: #DBEAFE; }

        /* ---------- 푸터 ---------- */
        .lp-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 24px;
            font-size: 11px;
            color: #6B7280;
            background: #FFFFFF;
            border-top: 1px solid #E5E7EB;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- 커스텀 타이틀바 (서버리스트 부모 창과 동일하게 titleBarStyle:'hidden' 가정) -->
    <div class="lp-titlebar">
        <div class="lp-titlebar__brand">
            <span class="lp-mark lp-mark--sm" aria-hidden="true">W<span class="lp-mark__s">s</span></span>
            <span>U4A Workspace - Login</span>
        </div>
        <div class="lp-winbtns">
            <button class="lp-winbtn"        id="lp-win-min"   title="Minimize" aria-label="Minimize">
                <svg class="lp-winicon" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><line x1="1.5" y1="5" x2="8.5" y2="5" /></svg>
            </button>
            <button class="lp-winbtn"        id="lp-win-max"   title="Maximize" aria-label="Maximize">
                <svg class="lp-winicon lp-winicon--max" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><rect x="1.5" y="1.5" width="7" height="7" rx="1.2" /></svg>
                <svg class="lp-winicon lp-winicon--restore" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><rect x="1.3" y="3" width="5.7" height="5.7" rx="1" /><path d="M3.4 3 V2.1 a1 1 0 0 1 1-1 H8.7 a1 1 0 0 1 1 1 V6.4 a1 1 0 0 1 -1 1 H7" /></svg>
            </button>
            <button class="lp-winbtn close"  id="lp-win-close" title="Close"    aria-label="Close">
                <svg class="lp-winicon" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><line x1="1.6" y1="1.6" x2="8.4" y2="8.4" /><line x1="8.4" y1="1.6" x2="1.6" y2="8.4" /></svg>
            </button>
        </div>
    </div>

    <!-- 본문 -->
    <main class="lp-page">
        <section class="lp-card" role="dialog" aria-labelledby="lp-card-title">
            <header class="lp-card__head">
                <span class="lp-mark lp-mark--lg" aria-hidden="true">W<span class="lp-mark__s">s</span></span>
                <h1 id="lp-card-title" class="lp-card__title">U4A Workspace Login</h1>
            </header>

            <div class="lp-field">
                <label class="lp-field__label" for="lp-client">CLIENT:</label>
                <div class="lp-input-wrap">
                    <input id="lp-client" class="lp-input" type="text" value="800" autocomplete="off" />
                    <button class="lp-input-btn lp-clear" data-target="lp-client" tabindex="-1" title="Clear" aria-label="Clear">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>
            </div>

            <div class="lp-field">
                <label class="lp-field__label" for="lp-userid">ID:</label>
                <div class="lp-input-wrap">
                    <input id="lp-userid" class="lp-input" type="text" value="SOCCERHS" autocomplete="off" spellcheck="false" />
                    <button class="lp-input-btn lp-clear" data-target="lp-userid" tabindex="-1" title="Clear" aria-label="Clear">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>
            </div>

            <div class="lp-field">
                <label class="lp-field__label" for="lp-password">PASSWORD:</label>
                <div class="lp-input-wrap">
                    <input id="lp-password" class="lp-input" type="password" autocomplete="off" />
                    <button class="lp-input-btn" id="lp-pw-toggle" tabindex="-1" title="Show / Hide" aria-label="Show or hide password">
                        <svg id="lp-pw-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5zm0 12.5a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="lp-field">
                <label class="lp-field__label" for="lp-language">LANGUAGE:</label>
                <select id="lp-language" class="lp-select">
                    <option value="EN">EN</option>
                    <option value="KO">KO</option>
                    <option value="JA">JA</option>
                    <option value="ZH">ZH</option>
                    <option value="DE">DE</option>
                </select>
            </div>

            <div class="lp-field">
                <label class="lp-field__label lp-field__label--normal" for="lp-wslanguage">Workspace Language:</label>
                <select id="lp-wslanguage" class="lp-select">
                    <option value="EN">EN</option>
                    <option value="KO">KO</option>
                </select>
            </div>

            <div class="lp-field lp-field--check">
                <label class="lp-field__label lp-field__label--normal" for="lp-remember">Remember:</label>
                <input id="lp-remember" class="lp-checkbox" type="checkbox" checked />
            </div>

            <button id="lp-btn-login" class="lp-btn-login" type="button">LOGIN</button>

            <div class="lp-quick">
                <button class="lp-quick__btn" data-id="영선" type="button">영선</button>
                <button class="lp-quick__btn" data-id="성호" type="button">성호</button>
                <button class="lp-quick__btn" data-id="은섭" type="button">은섭</button>
                <button class="lp-quick__btn" data-id="청윤" type="button">청윤</button>
            </div>
        </section>
    </main>

    <!-- 푸터 -->
    <footer class="lp-footer">
        <span>Copyright 2022. Infocg inc. all rights reserved.</span>
        <span id="lp-sysid">SYSID: UHA</span>
    </footer>

    <script>
    /* ====================================================================
       U4A Workspace — Login Page Script
       - 단독 동작 가능 (Electron 환경이 아니면 윈도우 버튼/IPC 만 비활성)
       - 부모 ServerList 가 보낸 if-meta-info 를 수신하면 SYSID 등 갱신
       ==================================================================== */
    (function () {
        "use strict";

        /* ---------- iframe 모드 감지 (부모 main 이 임베드한 경우) ---------- */
        var IS_EMBEDDED = false;
        try { IS_EMBEDDED = (window.self !== window.top); } catch (_) { IS_EMBEDDED = true; }
        if (IS_EMBEDDED) { document.body.classList.add("is-embedded"); }

        /* ---------- Electron 핸들 (있을 때만) ---------- */
        function getRemote() {
            try { if (typeof require === "function") return require("@electron/remote"); } catch (_) {}
            return null;
        }
        function getIpc() {
            try { if (typeof require === "function") return require("electron").ipcRenderer; } catch (_) {}
            return null;
        }
        const REMOTE = getRemote();
        const IPC    = getIpc();
        function curWin() { try { return REMOTE && REMOTE.getCurrentWindow(); } catch (_) { return null; } }

        /* ---------- 윈도우 버튼 (최소화/최대화·복원/닫기) ---------- */
        const $min   = document.getElementById("lp-win-min");
        const $max   = document.getElementById("lp-win-max");
        const $close = document.getElementById("lp-win-close");
        if ($min)   $min.onclick   = function () { const w = curWin(); if (w) w.minimize(); };
        if ($max)   $max.onclick   = function () {
            const w = curWin();
            if (!w) return;
            try { if (w.isMaximized()) w.unmaximize(); else w.maximize(); } catch (_) {}
        };
        if ($close) $close.onclick = function () { const w = curWin(); if (w) w.close(); else window.close(); };
        // 최대화/복원 상태에 따라 최대화 버튼 아이콘 토글
        const syncMaxIcon = function () {
            if (!$max) return;
            const w = curWin();
            let m = false; try { m = !!(w && w.isMaximized()); } catch (_) {}
            $max.classList.toggle("is-maximized", m);
            $max.title = m ? "Restore" : "Maximize";
        };
        (function () {
            const w = curWin();
            if (w && typeof w.on === "function") {
                try { w.on("maximize", syncMaxIcon); w.on("unmaximize", syncMaxIcon); } catch (_) {}
            }
            syncMaxIcon();
        })();

        /* ---------- input clear 버튼 가시성/동작 ---------- */
        document.querySelectorAll(".lp-clear").forEach(function (btn) {
            const id = btn.getAttribute("data-target");
            const $i = id && document.getElementById(id);
            if (!$i) return;
            function syncVis() { btn.classList.toggle("is-hidden", !$i.value); }
            $i.addEventListener("input", syncVis);
            btn.addEventListener("click", function () {
                $i.value = "";
                syncVis();
                try { $i.focus(); } catch (_) {}
            });
            syncVis();
        });

        /* ---------- 비밀번호 표시/숨김 ---------- */
        const $pw     = document.getElementById("lp-password");
        const $pwBtn  = document.getElementById("lp-pw-toggle");
        const $pwIcon = document.getElementById("lp-pw-icon");
        const ICON_EYE = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5zm0 12.5a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"/>';
        const ICON_EYE_OFF = '<path d="M12 7a5 5 0 015 5c0 .65-.13 1.26-.36 1.83l2.92 2.92A11.81 11.81 0 0023 12c-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16A5 5 0 0112 7zM2 4.27l2.28 2.28.46.46A11.8 11.8 0 001 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65a3 3 0 003 3c.22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53a5 5 0 01-5-5c0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16a3 3 0 00-3-3l-.17.01z"/>';
        if ($pwBtn && $pw && $pwIcon) {
            $pwBtn.addEventListener("click", function () {
                const showing = $pw.type === "text";
                $pw.type = showing ? "password" : "text";
                $pwIcon.innerHTML = showing ? ICON_EYE : ICON_EYE_OFF;
                try { $pw.focus(); } catch (_) {}
            });
        }

        /* ---------- 빠른 로그인 (영선/성호/은섭/청윤) — 지금은 ID 칸 채우기만 ---------- */
        document.querySelectorAll(".lp-quick__btn").forEach(function (b) {
            b.addEventListener("click", function () {
                const $id = document.getElementById("lp-userid");
                if (!$id) return;
                $id.value = b.getAttribute("data-id") || (b.textContent || "").trim();
                $id.dispatchEvent(new Event("input"));
                try { $id.focus(); } catch (_) {}
            });
        });

        /* ---------- LOGIN 클릭 ----------
           - iframe 모드: 부모(main/index.html)에 postMessage 로 자격증명 전달 → 부모가 세션 저장/라우팅
           - 단독 모드: 콘솔 로그만 (실제 인증 연동은 후속 작업) */
        function readForm() {
            return {
                client:     (document.getElementById("lp-client")     || {}).value || "",
                userid:     (document.getElementById("lp-userid")     || {}).value || "",
                password:   (document.getElementById("lp-password")   || {}).value || "",
                language:   (document.getElementById("lp-language")   || {}).value || "",
                wsLanguage: (document.getElementById("lp-wslanguage") || {}).value || "",
                remember:  !!(document.getElementById("lp-remember") && document.getElementById("lp-remember").checked),
            };
        }
        function submitLogin() {
            var data = readForm();
            try { console.log("[Login] submit:", { client: data.client, userid: data.userid, language: data.language, wsLanguage: data.wsLanguage, remember: data.remember }); } catch (_) {}
            if (IS_EMBEDDED) {
                try {
                    window.parent.postMessage({ type: "u4a-login-submit", payload: data }, "*");
                } catch (e) { try { console.warn("[Login] postMessage 실패:", e && e.message); } catch (_) {} }
            }
            // TODO: 단독 모드에서의 실제 인증 로직 연동
        }
        const $btnLogin = document.getElementById("lp-btn-login");
        if ($btnLogin) { $btnLogin.addEventListener("click", submitLogin); }
        // Enter 키로 LOGIN
        document.addEventListener("keydown", function (e) {
            if (e.key !== "Enter") return;
            const tag = (e.target && e.target.tagName) || "";
            if (tag === "SELECT" || tag === "BUTTON") return;
            if ($btnLogin) $btnLogin.click();
        });

        /* ---------- 서버 메타 적용 (공통) ---------- */
        function applyMeta(meta) {
            if (!meta) return;
            try { console.log("[Login] applyMeta:", meta); } catch (_) {}
            var si = (meta && meta.SERVERINFO) || meta || {};
            var sysid = si.SYSID || si.SYSTEMID || "";
            if (sysid) {
                var $s = document.getElementById("lp-sysid");
                if ($s) $s.textContent = "SYSID: " + sysid;
            }
            if (si.NAME) {
                try { document.title = "U4A Workspace - Login [" + si.NAME + "]"; } catch (_) {}
            }
        }

        /* ---------- 부모(ServerList)가 보낸 서버 메타 수신 ----------
           - 단독 모드: BrowserWindow.webContents 가 받은 if-meta-info 를 IPC 로 수신
           - iframe 모드: 부모 main/index.html 이 postMessage("u4a-meta") 로 전달 */
        if (IPC) {
            try { IPC.on("if-meta-info", function (_e, meta) { applyMeta(meta); }); }
            catch (e) { try { console.warn("[Login] IPC on('if-meta-info') 등록 실패:", e && e.message); } catch (_) {} }
        }
        window.addEventListener("message", function (e) {
            var d = e && e.data;
            if (!d || typeof d !== "object") return;
            if (d.type === "u4a-meta") { applyMeta(d.payload); }
