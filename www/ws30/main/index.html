<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U4A Workspace</title>
    <style>
        /* ====================================================================
           U4A Workspace — ws30 Main (Login Router + Main Shell)
           ----
           동작:
            1) 페이지 로드 시 sessionStorage(u4a-ws30-session-v1) 확인
            2) 세션 없음 → ../login/index.html 을 iframe 으로 임베드(로그인 모드)
            3) 세션 있음 → 메인 콘텐츠 렌더(현 단계는 placeholder — 실제 메인 UI 자리)
            4) iframe(login) → postMessage('u4a-login-submit') → 부모(main)가 세션 저장 + 메인 전환
            5) 부모 ServerList → if-meta-info(IPC) → 본 main 이 수신해서 메모리 보관
               · iframe(login) 에도 postMessage('u4a-meta') 로 전달 (SYSID 등 표시)
            6) 우측 상단 Logout → 세션 클리어 → 다시 로그인 모드로 복귀
           ==================================================================== */

        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            font-size: 14px;
            color: #1F2937;
            background: #F4F5F7;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        button { font-family: inherit; }

        /* ---------- 커스텀 타이틀바 (titleBarStyle:'hidden' 대응) ---------- */
        .m-titlebar {
            -webkit-app-region: drag;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 32px;
            background: #FFFFFF;
            border-bottom: 1px solid #E5E7EB;
            user-select: none;
            flex-shrink: 0;
        }
        .m-titlebar__brand {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            font-size: 12px;
            color: #374151;
        }
        .m-winbtns { -webkit-app-region: no-drag; display: flex; }
        .m-winbtn {
            width: 46px; height: 32px;
            border: 0; background: transparent;
            color: #6B7280; cursor: pointer;
            font-size: 14px; line-height: 1;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .m-winbtn:hover { background: #F3F4F6; }
        .m-winbtn.close:hover { background: #E81123; color: #FFFFFF; }

        /* ---------- WS 브랜드 마크 ---------- */
        .m-mark {
            display: inline-flex;
            align-items: baseline;
            color: #B528C7;
            font-weight: 800;
            font-style: italic;
            line-height: 1;
            letter-spacing: -1px;
        }
        .m-mark__s { font-size: 0.55em; margin-left: -0.05em; }
        .m-mark--sm { font-size: 16px; }

        /* ---------- 앱 영역 ---------- */
        .m-app {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        /* 로그인 슬롯 (iframe) */
        .m-slot--login {
            position: absolute;
            inset: 0;
            background: #F4F5F7;
        }
        .m-iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: transparent;
        }

        /* 메인 콘텐츠 슬롯 */
        .m-slot--main {
            position: absolute;
            inset: 0;
            overflow: auto;
            padding: 24px;
        }
        .m-slot[hidden] { display: none !important; }

        .m-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }
        .m-h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            letter-spacing: -0.3px;
        }
        .m-sub {
            margin: 4px 0 0;
            font-size: 12px;
            color: #6B7280;
        }
        .m-logout {
            border: 1px solid #D1D5DB;
            background: #FFFFFF;
            color: #374151;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .m-logout:hover { background: #F9FAFB; border-color: #9CA3AF; }
        .m-logout:active { background: #F3F4F6; }

        /* 정보 카드 */
        .m-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            padding: 18px 22px;
            margin-bottom: 14px;
            box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04);
        }
        .m-h2 {
            margin: 0 0 10px;
            font-size: 13px;
            font-weight: 700;
            color: #6B7280;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .m-list {
            margin: 0;
            display: grid;
            grid-template-columns: 160px 1fr;
            row-gap: 6px;
            column-gap: 12px;
            font-size: 13px;
        }
        .m-list dt {
            color: #6B7280;
            font-weight: 500;
        }
        .m-list dd {
            margin: 0;
            color: #111827;
            font-weight: 500;
            word-break: break-all;
        }
        .m-list dd.m-empty { color: #9CA3AF; font-weight: 400; font-style: italic; }

        .m-card--note {
            background: #FEFCE8;
            border-color: #FEF08A;
            color: #713F12;
        }
        .m-card--note p { margin: 0; font-size: 13px; }

        /* 초기 점멸 방지 — 라우팅 결정 전까지는 두 슬롯 다 숨김 */
        .m-app.is-init { visibility: hidden; }
    </style>
</head>
<body>

    <!-- 타이틀바 -->
    <div class="m-titlebar">
        <div class="m-titlebar__brand">
            <span class="m-mark m-mark--sm" aria-hidden="true">W<span class="m-mark__s">s</span></span>
            <span id="m-title-text">U4A Workspace</span>
        </div>
        <div class="m-winbtns">
            <button class="m-winbtn"       id="m-win-min"   title="Minimize" aria-label="Minimize">&#8211;</button>
            <button class="m-winbtn"       id="m-win-max"   title="Maximize" aria-label="Maximize">&#9633;</button>
            <button class="m-winbtn close" id="m-win-close" title="Close"    aria-label="Close">&#10005;</button>
        </div>
    </div>

    <!-- 앱 영역 (로그인 슬롯 ↔ 메인 슬롯 스왑) -->
    <main class="m-app is-init" id="m-app">

        <!-- 로그인 슬롯 (미로그인 시 노출) -->
        <section class="m-slot m-slot--login" id="m-slot-login" hidden>
            <iframe id="m-login-iframe" class="m-iframe" title="Login" src="about:blank"></iframe>
        </section>

        <!-- 메인 슬롯 (로그인 후 노출 — placeholder, 실제 ws30 메인 UI 자리) -->
        <section class="m-slot m-slot--main" id="m-slot-main" hidden>
            <header class="m-header">
                <div>
                    <h1 class="m-h1" id="m-welcome">U4A Workspace</h1>
                    <p class="m-sub">ws30 Main (placeholder)</p>
                </div>
                <button class="m-logout" id="m-logout" type="button">Logout</button>
            </header>

            <section class="m-card">
                <h2 class="m-h2">Session</h2>
                <dl class="m-list" id="m-session-info"></dl>
            </section>

            <section class="m-card">
                <h2 class="m-h2">Server Info (from ServerList)</h2>
                <dl class="m-list" id="m-server-info"></dl>
            </section>

            <section class="m-card m-card--note">
                <p>이 영역은 실제 ws30 메인 화면이 들어갈 자리입니다 (현 단계 placeholder).</p>
            </section>
        </section>
    </main>

    <script>
    /* ====================================================================
       ws30 Main — 라우팅 / 세션 / IPC 핸들러
       ==================================================================== */
    (function () {
        "use strict";

        var SESS_KEY = "u4a-ws30-session-v1";

        /* ---------- Electron 핸들 ---------- */
        function getRemote() {
            try { if (typeof require === "function") return require("@electron/remote"); } catch (_) {}
            return null;
        }
        function getIpc() {
            try { if (typeof require === "function") return require("electron").ipcRenderer; } catch (_) {}
            return null;
        }
        var REMOTE = getRemote();
        var IPC    = getIpc();
        function curWin() { try { return REMOTE && REMOTE.getCurrentWindow(); } catch (_) { return null; } }

        /* ---------- 윈도우 버튼 ---------- */
        var $min = document.getElementById("m-win-min");
        var $max = document.getElementById("m-win-max");
        var $close = document.getElementById("m-win-close");
        if ($min)   $min.onclick   = function () { var w = curWin(); if (w) w.minimize(); };
        if ($max)   $max.onclick   = function () {
            var w = curWin();
            if (!w) return;
            try { if (w.isMaximized()) w.unmaximize(); else w.maximize(); } catch (_) {}
        };
        if ($close) $close.onclick = function () { var w = curWin(); if (w) w.close(); else window.close(); };

        /* ---------- 메모리 보관: 부모 ServerList 가 보낸 서버 메타 ---------- */
        // IPC if-meta-info 는 BrowserWindow 의 webContents 로 전달되므로 본 페이지가 1차 수신자
        // 이후 로그인 iframe 에는 postMessage('u4a-meta') 로 재배포함
        var SERVER_META = null;
        if (IPC) {
            try {
                IPC.on("if-meta-info", function (_e, meta) {
                    SERVER_META = meta || null;
                    try { console.log("[Main] received if-meta-info:", meta); } catch (_) {}
                    // 로그인 iframe 이 떠 있으면 즉시 전달
                    pushMetaToLoginFrame();
                    // 메인 슬롯이 노출 상태면 즉시 반영
                    if (!$slotMain.hasAttribute("hidden")) { renderServerInfo(); updateTitleFromMeta(); }
                });
            } catch (e) { try { console.warn("[Main] IPC on('if-meta-info') 등록 실패:", e && e.message); } catch (_) {} }
        }

        /* ---------- DOM 참조 ---------- */
        var $app        = document.getElementById("m-app");
        var $slotLogin  = document.getElementById("m-slot-login");
        var $slotMain   = document.getElementById("m-slot-main");
        var $iframe     = document.getElementById("m-login-iframe");
        var $welcome    = document.getElementById("m-welcome");
        var $sessInfo   = document.getElementById("m-session-info");
        var $srvInfo    = document.getElementById("m-server-info");
        var $logout     = document.getElementById("m-logout");

        /* ---------- 세션 ----------
           - sessionStorage 사용 (브라우저 창 닫으면 자동 만료 — 워크스페이스 1회용 세션)
           - "Remember" 체크된 경우는 후속 작업에서 localStorage 로 승격 검토 */
        function readSession() {
            try {
                var raw = sessionStorage.getItem(SESS_KEY);
                if (!raw) return null;
                var o = JSON.parse(raw);
                return (o && typeof o === "object") ? o : null;
            } catch (_) { return null; }
        }
        function writeSession(sess) {
            try { sessionStorage.setItem(SESS_KEY, JSON.stringify(sess || {})); return true; }
            catch (e) { try { console.warn("[Main] session 저장 실패:", e && e.message); } catch (_) {} return false; }
        }
        function clearSession() {
            try { sessionStorage.removeItem(SESS_KEY); } catch (_) {}
        }

        /* ---------- 라우팅 ---------- */
        function showLogin() {
            $slotMain.setAttribute("hidden", "");
            $slotLogin.removeAttribute("hidden");
            // iframe 의 src 를 한 번만 세팅 (재진입 시 reload 강제)
            try {
                var src = "../login/index.html";
                // cache-buster 로 동일 src 재할당 시에도 reload 보장
                $iframe.src = src + (src.indexOf("?") >= 0 ? "&" : "?") + "_ts=" + Date.now();
            } catch (_) {}
            $app.classList.remove("is-init");
        }
        function showMain(sess) {
            $slotLogin.setAttribute("hidden", "");
            // iframe 리소스 해제 (다음에 다시 띄울 때 fresh load)
            try { $iframe.src = "about:blank"; } catch (_) {}
            $slotMain.removeAttribute("hidden");
            renderSessionInfo(sess);
            renderServerInfo();
            updateTitleFromMeta();
            $app.classList.remove("is-init");
        }

        /* ---------- 세션/서버 정보 표시 ---------- */
        function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c]; }); }
        function row(dt, dd, empty) {
            var has = !(dd == null || dd === "");
            return "<dt>" + esc(dt) + "</dt><dd" + (has ? "" : ' class="m-empty"') + ">" + (has ? esc(dd) : esc(empty || "-")) + "</dd>";
        }
        function renderSessionInfo(sess) {
            sess = sess || readSession() || {};
            if ($welcome) {
                $welcome.textContent = sess.userid ? ("Welcome, " + sess.userid) : "U4A Workspace";
            }
            $sessInfo.innerHTML =
                row("User ID",            sess.userid) +
                row("Client",             sess.client) +
                row("Language",           sess.language) +
                row("Workspace Language", sess.wsLanguage) +
                row("Logged in at",       sess.loggedInAt);
        }
        function renderServerInfo() {
            var si = (SERVER_META && SERVER_META.SERVERINFO) || {};
            var srv = si.SERVER_INFO || {};
            var det = si.SERVER_INFO_DETAIL || {};
            $srvInfo.innerHTML =
                row("Server Name", si.NAME) +
                row("SYSID",       si.SYSID || si.SYSTEMID) +
                row("Instance No", si.INSTANCENO) +
                row("Protocol",    srv.protocol) +
                row("Host",        srv.host || det.host) +
                row("Port",        srv.port || det.port);
        }
        function updateTitleFromMeta() {
            var si = (SERVER_META && SERVER_META.SERVERINFO) || {};
            if (si.NAME) {
                try { document.title = "U4A Workspace [" + si.NAME + "]"; } catch (_) {}
                var $tt = document.getElementById("m-title-text");
                if ($tt) $tt.textContent = "U4A Workspace  ·  " + si.NAME;
            }
        }

        /* ---------- iframe(login) 으로 메타 push ----------
           - iframe 로드 완료 후, SERVER_META 가 있으면 전달
           - SERVER_META 가 나중에 도착해도 (IPC 비동기) 재전송 처리 */
        function pushMetaToLoginFrame() {
            if (!SERVER_META) return;
            try {
                if ($iframe && $iframe.contentWindow) {
                    $iframe.contentWindow.postMessage({ type: "u4a-meta", payload: SERVER_META }, "*");
                }
            } catch (e) { try { console.warn("[Main] iframe 메타 push 실패:", e && e.message); } catch (_) {} }
        }
        $iframe.addEventListener("load", function () {
            if ($slotLogin.hasAttribute("hidden")) return;   // 비활성 슬롯이면 skip
            pushMetaToLoginFrame();
        });

        /* ---------- iframe(login) → 부모 postMessage 수신 ----------
           - "u4a-login-submit" : 자격증명 도착 → 검증(현 stub) → 세션 저장 → 메인 전환 */
        window.addEventListener("message", function (e) {
            var d = e && e.data;
            if (!d || typeof d !== "object") return;
            if (d.type !== "u4a-login-submit") return;

            var p = d.payload || {};
            try { console.log("[Main] login submit received:", { userid: p.userid, client: p.client }); } catch (_) {}

            // 검증(현 stub — 추후 실제 인증 연동)
            if (!p.userid) { try { console.warn("[Main] userid 비어있음 → 무시"); } catch (_) {} return; }

            // 세션 저장 (비밀번호는 보관하지 않음)
            var sess = {
                userid:     p.userid || "",
                client:     p.client || "",
                language:   p.language || "",
                wsLanguage: p.wsLanguage || "",
                remember:  !!p.remember,
                loggedInAt: new Date().toISOString(),
            };
            writeSession(sess);
            showMain(sess);
        });

        /* ---------- Logout ---------- */
        $logout.addEventListener("click", function () {
            clearSession();
            showLogin();
        });

        /* ---------- 초기 라우팅 ---------- */
        (function init() {
            var sess = readSession();
            if (sess && sess.userid) showMain(sess);
            else                     showLogin();
        })();
    })();
    </script>
</body>
</html>
