<!DOCTYPE html>
<html lang="ko">

<head>
    <title>U4A Workspace - Main</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <link rel="icon" type="image/x-icon" href="../../../img/logo.ico" />

    <script>
        (function () {
            function valid(v) { return v === "dark" || v === "white" || v === "purple"; }
            var t = "";
            try { var q = new URLSearchParams(location.search).get("u4aTheme"); if (valid(q)) { t = q; try { localStorage.setItem("u4a-ws-theme-v1", q); } catch (_) {} } } catch (_) {}
            if (!t) { try { var v = localStorage.getItem("u4a-ws-theme-v1"); if (valid(v)) t = v; } catch (_) {} }
            document.documentElement.setAttribute("data-theme", t || "purple");
        })();
    </script>

    <style>
        /* ===== 자급자족 테마 토큰 (외부 CSS 미참조) ===== */
        :root{
            --bg:#0f0818; --panel:#1e1430; --text:#f5e7ff; --soft:#cdb5e6; --dim:#8a7aa0;
            --line:rgba(216,180,254,.16); --line2:rgba(216,180,254,.28); --hover:rgba(255,255,255,.07);
            --accent:#ec4899; --accent2:#a855f7; --grad:linear-gradient(135deg,#ec4899,#a855f7); --danger:#ef4444;
            --btn:rgba(255,255,255,.05); --shadow:0 24px 80px rgba(0,0,0,.42);
            --root-bg:#0a0d14;
            --brand:#c44dff; --fade:linear-gradient(to right,#0a0d14 0%,#0a0d14 10%,rgba(10,13,20,.97) 16%,rgba(10,13,20,.90) 22%,rgba(10,13,20,.78) 28%,rgba(10,13,20,.60) 35%,rgba(10,13,20,.38) 43%,rgba(10,13,20,.18) 52%,rgba(10,13,20,.05) 61%,transparent 70%);
        }
        html[data-theme="dark"]{
            --bg:#0b1118; --panel:#141d28; --text:#e7eef7; --soft:#a9bacb; --dim:#6b7d90;
            --line:rgba(120,160,210,.16); --line2:rgba(120,160,210,.28); --hover:rgba(255,255,255,.06);
            --accent:#3b82f6; --accent2:#06b6d4; --grad:linear-gradient(135deg,#3b82f6,#06b6d4); --btn:rgba(255,255,255,.05);
            --root-bg:#0a0d14;
            --brand:#5ab0ff; --fade:linear-gradient(to right,#0a0d14 0%,#0a0d14 10%,rgba(10,13,20,.97) 16%,rgba(10,13,20,.90) 22%,rgba(10,13,20,.78) 28%,rgba(10,13,20,.60) 35%,rgba(10,13,20,.38) 43%,rgba(10,13,20,.18) 52%,rgba(10,13,20,.05) 61%,transparent 70%);
        }
        html[data-theme="white"]{
            --bg:#eef2f7; --panel:#ffffff; --text:#1a2030; --soft:#55607a; --dim:#8a93a3;
            --line:rgba(20,30,60,.12); --line2:rgba(20,30,60,.2); --hover:rgba(0,0,0,.05);
            --accent:#9333ea; --accent2:#6366f1; --grad:linear-gradient(135deg,#9333ea,#6366f1); --danger:#dc2626;
            --btn:rgba(0,0,0,.04); --shadow:0 24px 80px rgba(0,0,0,.14);
            --root-bg:#ffffff;
            --brand:#9333ea; --fade:linear-gradient(to right,#ffffff 0%,#ffffff 10%,rgba(255,255,255,.97) 16%,rgba(255,255,255,.90) 22%,rgba(255,255,255,.78) 28%,rgba(255,255,255,.60) 35%,rgba(255,255,255,.38) 43%,rgba(255,255,255,.18) 52%,rgba(255,255,255,.05) 61%,transparent 70%);
        }

        /* ===== drag-safe: blur/무한애니/mix-blend/filter 없음 ===== */
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Segoe UI","Malgun Gothic",Arial,sans-serif; color: var(--text); background: var(--bg); }
        .ws-main-app { display: flex; flex-direction: column; height: 100vh; }

        .ws-menubar { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
        .ws-menu-group { display: flex; align-items: center; gap: 2px; }
        .ws-menu-btn { background: transparent; border: 0; color: var(--text); font: inherit; font-size: 13px; padding: 7px 11px; border-radius: 7px; cursor: pointer; }
        .ws-menu-btn:hover { background: var(--hover); }
        .ws-menu-wrap { position: relative; }
        .ws-menu { position: absolute; top: 100%; left: 0; margin-top: 4px; min-width: 150px; z-index: 100; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 6px; box-shadow: var(--shadow); }
        .ws-menu.is-hidden { display: none; }
        .ws-menu__item { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
        .ws-menu__item:hover { background: var(--hover); }
        .ws-menu__ico, .ws-ico { display: inline-flex; }
        .ws-ico svg { width: 17px; height: 17px; }
        .ws-menubar__spacer { flex: 1 1 auto; }

        .ws-cluster { display: flex; align-items: center; gap: 6px; }
        .ws-ai-btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px; background: var(--btn); border: 1px solid var(--line); color: var(--soft); cursor: pointer; }
        .ws-ai-btn .ws-ico svg { width: 16px; height: 16px; }
        .ws-icon-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: var(--soft); cursor: pointer; }
        .ws-icon-btn:hover { background: var(--hover); color: var(--text); }
        .ws-icon-btn .ws-ico svg { width: 18px; height: 18px; }
        .ws-icon-btn--danger { color: var(--danger); }
        .ws-sap-logo { font-weight: 800; font-size: 12px; color: #fff; background: #0a6ed1; padding: 4px 7px; border-radius: 5px; }
        .ws-tcode input { width: 150px; font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 7px; background: var(--btn); border: 1px solid var(--line); color: var(--text); outline: none; }
        .ws-ico svg { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

        .ws-toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; height: 46px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
        .ws-tool-btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; padding: 7px 11px; background: transparent; border: 0; border-radius: 8px; color: var(--text); cursor: pointer; }
        .ws-tool-btn:hover { background: var(--hover); }
        .ws-tool-btn--danger { color: var(--danger); }
        .ws-tool-btn .ws-ico svg { width: 17px; height: 17px; }
        .ws-tool-sep { width: 1px; height: 22px; background: var(--line); margin: 0 7px; }
        .ws-split { display: inline-flex; align-items: center; }
        .ws-split__caret { width: 22px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--soft); cursor: pointer; border-radius: 6px; }
        .ws-split__caret:hover { background: var(--hover); }
        .ws-split__caret .ws-ico svg { width: 16px; height: 16px; }

        .ws-appname-row { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
        .ws-appname-row__label { font-size: 13px; color: var(--soft); white-space: nowrap; }
        .ws-appname-search { position: relative; flex: 1 1 auto; }
        .ws-appname-search__ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--dim); }
        .ws-appname-search__ico svg { width: 16px; height: 16px; }
        .ws-appname-search input { width: 100%; font: inherit; font-size: 13px; padding: 9px 12px 9px 36px; border-radius: 9px; background: var(--btn); border: 1px solid var(--line); color: var(--text); outline: none; }

        /* 본문 스테이지 (정적 — glow 애니/filter/mix-blend 없음) */
        /* ===== 본문 스테이지 + 배경 (원본 main.css 값 그대로) ===== */
        .ws-stage { flex: 1 1 auto; position: relative; min-height: 0; overflow: hidden; }
        .u4a-ws-root { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 4.5vh 4.5vw; overflow: hidden; background: var(--root-bg); }
        .u4a-ws-bg-image { position: absolute; top: 0; right: 0; bottom: 0; width: 78%; pointer-events: none; z-index: 1; overflow: hidden; }
        .u4a-ws-bg-image img { position: absolute; top: 0; right: 0; bottom: 0; height: 100%; width: 100%; object-fit: cover; object-position: right center; }
        .u4a-ws-anim-glow { position: absolute; top: 0; right: 0; bottom: 0; width: 78%; pointer-events: none; z-index: 3; opacity: .55;
            background:
                radial-gradient(ellipse 20% 80% at 100% 50%, rgba(130,70,255,.55) 0%, transparent 100%),
                radial-gradient(ellipse 80% 20% at 55% 0%, rgba(80,130,255,.45) 0%, transparent 100%),
                radial-gradient(ellipse 80% 20% at 55% 100%, rgba(150,60,255,.40) 0%, transparent 100%),
                radial-gradient(ellipse 50% 65% at 72% 48%, rgba(120,80,255,.30) 0%, rgba(60,100,255,.15) 50%, transparent 80%); }
        .u4a-ws-bg-fade { position: absolute; top: 0; right: 0; bottom: 0; width: 85%; pointer-events: none; z-index: 7; background: var(--fade); }
        .u4a-ws-brand-wrap { display: flex; align-items: flex-end; z-index: 20; position: relative; }
        .u4a-ws-brand-text { color: #ffffff; line-height: 1.1; text-transform: uppercase; }
        .u4a-ws-brand-u4a { font-size: 6.5rem; font-weight: 900; letter-spacing: -0.2rem;
            background: linear-gradient(to bottom, #cc00ff 40%, #aaa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .u4a-ws-brand-desc { font-size: 2.2rem; font-weight: 300; letter-spacing: 0.5rem; margin-top: -0.5rem; opacity: 0.8; }
        /* 화이트 테마: 어두운 그라데이션 + 어두운 WORKSPACE (원본과 동일) */
        html[data-theme="white"] .u4a-ws-brand-text { color: #12172a; }
        html[data-theme="white"] .u4a-ws-brand-u4a { background: linear-gradient(160deg, #0d1020 0%, #cc00ff 50%, #2e2472 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .u4a-ws-cert-layer { position: absolute; left: 28%; right: 4.5vw; bottom: 4.5vh; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: flex-end; align-items: flex-end; gap: 1vw; z-index: 20; pointer-events: none; }
        .u4a-ws-cert-layer img { height: clamp(28px, 3.5vw, 85px); width: auto; }
        .u4a-ws-cert-layer--light { display: none; }
        html[data-theme="white"] .u4a-ws-cert-layer--dark { display: none; }
        html[data-theme="white"] .u4a-ws-cert-layer--light { display: flex; }

        /* 모달 (Main.js _modalShell — drag-safe) */
        .ws-modal-backdrop { position: fixed; inset: 0; z-index: 9500; display: flex; align-items: center; justify-content: center; background: rgba(8,4,14,.6); opacity: 0; transition: opacity .18s; }
        .ws-modal-backdrop.is-open { opacity: 1; }
        .ws-modal { width: 100%; max-width: 440px; margin: 16px; background: var(--panel); border: 1px solid var(--line2); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
        .ws-modal__head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
        .ws-modal__head .ws-ico svg { width: 18px; height: 18px; color: var(--accent2); }
        .ws-modal__title { flex: 1 1 auto; font-weight: 700; font-size: 15px; }
        .ws-modal__close { background: transparent; border: 0; color: var(--soft); font-size: 16px; cursor: pointer; width: 30px; height: 30px; border-radius: 7px; }
        .ws-modal__close:hover { background: var(--hover); color: var(--text); }
        .ws-modal__body { padding: 18px; }
        .ws-modal__foot { padding: 12px 18px; display: flex; justify-content: flex-end; border-top: 1px solid var(--line); }
        .ws-modal__btn { font: inherit; font-size: 13px; padding: 8px 18px; border-radius: 9px; cursor: pointer; background: var(--grad); border: 0; color: #fff; }
        .ws-opt-field { } .ws-opt-label { font-size: 12px; color: var(--soft); margin-bottom: 8px; }
        .ws-seg { display: flex; gap: 6px; } .ws-seg__btn { flex: 1; font: inherit; font-size: 13px; padding: 9px; border-radius: 9px; cursor: pointer; background: var(--btn); border: 1px solid var(--line); color: var(--text); }
        .ws-seg__btn.is-active { background: var(--grad); border-color: transparent; color: #fff; }
        .ws-info-list { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13px; }
        .ws-info-list dt { color: var(--soft); } .ws-info-list dd { margin: 0; color: var(--text); }
    </style>
</head>

<body>
    <!-- 실제 Main.html 과 동일한 구조 (Main.js 가 조작) -->
    <div class="ws-main-app">

        <div class="ws-menubar">
            <div class="ws-menu-group">
                <button class="ws-menu-btn">추가 정보</button>
                <button class="ws-menu-btn">유틸리티</button>
                <div class="ws-menu-wrap">
                    <button id="ws-sys-btn" class="ws-menu-btn" aria-haspopup="true" aria-expanded="false">시스템</button>
                    <div id="ws-sys-menu" class="ws-menu is-hidden" role="menu" aria-label="시스템">
                        <div id="ws-sys-info" class="ws-menu__item" role="menuitem" tabindex="-1">
                            <span class="ws-menu__ico" aria-hidden="true"><span class="ws-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6h.01"/></svg></span></span>
                            <span class="ws-menu__text">정보</span>
                        </div>
                        <div id="ws-sys-options" class="ws-menu__item" role="menuitem" tabindex="-1">
                            <span class="ws-menu__ico" aria-hidden="true"><span class="ws-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V15z"/></svg></span></span>
                            <span class="ws-menu__text">옵션</span>
                        </div>
                    </div>
                </div>
                <button class="ws-menu-btn">도움말</button>
                <button class="ws-menu-btn">테스트</button>
            </div>

            <div class="ws-menubar__spacer"></div>

            <div class="ws-cluster">
                <button class="ws-ai-btn" title="AI 연결/해제"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 7H7a5 5 0 0 0 0 10h1"/><path d="M16 7h1a5 5 0 0 1 0 10h-1"/><path d="M9 12h2"/><path d="M13 12h2"/><path d="M4 4l16 16" opacity=".55"/></svg></span><span>AI 연결해제됨</span></button>
                <button class="ws-icon-btn" title="브라우저 숨기기"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A9 9 0 0 1 12 5c6.5 0 10 7 10 7a13.2 13.2 0 0 1-2.2 2.9"/><path d="M6.6 6.6A13 13 0 0 0 2 12s3.5 7 10 7a9 9 0 0 0 3.4-.7"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></span></button>
                <span class="ws-sap-logo" title="SAP Easy Access (SMEN)">SAP</span>
                <span class="ws-tcode"><input type="text" placeholder="SAP T-CODE" maxlength="20" autocomplete="off" spellcheck="false" /></span>
                <button class="ws-icon-btn" title="Browser Pin"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 3h6l-1.2 5.5L17 12v2H7v-2l3.2-3.5z"/></svg></span></button>
                <button class="ws-icon-btn" title="zoom"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg></span></button>
                <button class="ws-icon-btn" title="window Text Search"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span></button>
                <button id="ws-logoff" class="ws-icon-btn ws-icon-btn--danger" title="Logoff"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.5 6.5a8 8 0 1 0 11 0"/></svg></span></button>
            </div>
        </div>

        <div class="ws-toolbar">
            <button class="ws-tool-btn" title="생성 (Ctrl+F12)"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span><span>생성</span></button>
            <button class="ws-tool-btn" title="편집 (F6)"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span><span>편집</span></button>
            <button class="ws-tool-btn ws-tool-btn--danger" title="삭제 (Ctrl+F10)"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/></svg></span><span>삭제</span></button>
            <button class="ws-tool-btn" title="복사 (Shift+F11)"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span><span>복사</span></button>
            <span class="ws-tool-sep"></span>
            <button class="ws-tool-btn" title="조회 (F7)"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span>조회</span></button>
            <span class="ws-split">
                <button class="ws-tool-btn" title="실행 (F8)"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/></svg></span><span>실행</span></button>
                <button class="ws-split__caret" title="브라우저 선택"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></span></button>
            </span>
            <span class="ws-tool-sep"></span>
            <button class="ws-tool-btn" title="예제 열기 (Ctrl+F1)"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 7c-2-1.3-5-1.8-8-1v12c3-.8 6-.3 8 1 2-1.3 5-1.8 8-1V6c-3-.8-6-.3-8 1z"/><path d="M12 7v13"/></svg></span><span>예제 열기</span></button>
            <button class="ws-tool-btn" title="앱 멀티 미리보기 (Ctrl+F3)"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="13" height="10" rx="1"/><path d="M6 18h6"/><path d="M9 14v4"/><rect x="16" y="8" width="6" height="12" rx="1"/></svg></span><span>앱 멀티 미리보기</span></button>
            <span class="ws-tool-sep"></span>
            <button class="ws-tool-btn" title="새 창 (Ctrl+N)"><span class="ws-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8"/><path d="M8 12h8"/></svg></span><span>새 창</span></button>
        </div>

        <div class="ws-appname-row">
            <span class="ws-appname-row__label">앱 이름:</span>
            <span class="ws-appname-search">
                <span class="ws-appname-search__ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
                <input type="text" placeholder="Search" autocomplete="off" spellcheck="false" />
            </span>
        </div>

        <div class="ws-stage">
            <div class="u4a-ws-root">
                <div class="u4a-ws-bg-image"><img src="../../../img/UFOA.png" alt="" onerror="this.style.display='none'" /></div>
                <div class="u4a-ws-anim-glow"></div>
